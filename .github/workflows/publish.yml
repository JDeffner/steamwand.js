name: Publish

on:
  push:
    tags: ['v*']

jobs:
  npmjs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0     # ancestry check below needs real history
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # A tag can be pushed from any commit, including one that was never merged.
      # Releasing from an unmerged branch is almost never intended, so refuse it.
      - name: Check the tag is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::tag $GITHUB_REF_NAME is not on main. Merge to main first, then tag."
            exit 1
          fi

      - name: Check tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: npm publish --access public

  github-packages:
    needs: npmjs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@jdeffner'
      - run: pnpm install --frozen-lockfile

      # GitHub Packages only accepts scoped names, so the same code ships there
      # as @jdeffner/steamwand.js. Runner-only edit; never committed.
      - name: Scope the package name for GitHub Packages
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            p.name = '@jdeffner/steamwand.js';
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "

      # No --provenance here: that is an npmjs feature and GitHub Packages rejects it.
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
