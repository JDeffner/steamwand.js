<!doctype html>
<!-- Source for the 1280x640 GitHub social preview. Re-render: see assets/README.md -->
<html>
<head>
<meta charset="utf-8">
<style>
  /* Near-black base on purpose: Steam's #1b2838 navy only gave the #66c0f4
     wordmark 7.4:1, and washed it out. This base takes it to 9.5:1. */
  :root { --bg:#0b0f14; --line:#1f2d3d; --fg:#c7d5e0; --dim:#6f8496; --acc:#66c0f4; }
  /* Montserrat for display (geometric, near Steam's own Motiva Sans);
     Cascadia Code only where the text really is code. */
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:1280px; height:640px; overflow:hidden; }
  body {
    background:var(--bg);
    font-family:"Montserrat","Segoe UI",sans-serif;
    color:var(--fg);
    position:relative;
  }
  .grid {
    position:absolute; inset:0;
    background-image:radial-gradient(circle at center, #1f2d3d 1.6px, transparent 1.7px);
    background-size:32px 32px;
    opacity:.5;
  }
  .glow {
    position:absolute; right:-260px; bottom:-320px; width:900px; height:900px;
    background:radial-gradient(circle, rgba(102,192,244,.10) 0%, rgba(102,192,244,0) 62%);
  }
  .frame { position:absolute; inset:0; border:1px solid var(--line); }

  main {
    position:relative; height:100%; padding:0 96px;
    display:flex; flex-direction:column; justify-content:center;
  }

  h1 { font-size:132px; line-height:1; color:var(--acc); font-weight:700; letter-spacing:-.025em; }
  h1 .js { color:var(--fg); opacity:.5; font-weight:600; }

  .tag { margin-top:34px; font-size:41px; line-height:1.38; color:var(--fg); font-weight:400; }
  .tag b { color:var(--acc); font-weight:700; }

  .cmd {
    margin-top:54px; align-self:flex-start;
    border:1px solid var(--line); border-radius:8px;
    background:rgba(255,255,255,.02);
    padding:18px 30px; font-size:29px; color:var(--fg);
    font-family:"Cascadia Code","Consolas",monospace;
  }
  .cmd .p { color:var(--acc); margin-right:14px; }

  .repo {
    position:absolute; right:96px; bottom:52px; font-size:21px; color:var(--dim);
    font-family:"Cascadia Code","Consolas",monospace;
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="frame"></div>
  <main>
    <h1>steamwand<span class="js">.js</span></h1>
    <div class="tag">
      TypeScript bindings for the Steamworks SDK.<br>
      <b>No native build step.</b>
    </div>
    <div class="cmd"><span class="p">$</span>npm i steamwand.js</div>
  </main>
  <div class="repo">github.com/JDeffner/steamwand.js</div>
</body>
</html>
