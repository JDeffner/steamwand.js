<!doctype html>
<!-- Source for the 1200x280 README banner. Re-render: see assets/README.md -->
<html>
<head>
<meta charset="utf-8">
<style>
  /* Near-black base on purpose: Steam's #1b2838 navy only gave the #66c0f4
     wordmark 7.4:1, and washed it out. This base takes it to 9.5:1. */
  :root { --bg:#0b0f14; --line:#1f2d3d; --fg:#c7d5e0; --dim:#6f8496; --acc:#66c0f4; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:1200px; height:280px; overflow:hidden; }
  body {
    background:var(--bg);
    font-family:"Montserrat","Segoe UI",sans-serif;
    color:var(--fg);
    position:relative;
  }
  .grid {
    position:absolute; inset:0;
    background-image:radial-gradient(circle at center, #1f2d3d 1.6px, transparent 1.7px);
    background-size:28px 28px;
    opacity:.5;
  }
  .glow {
    position:absolute; right:-240px; bottom:-300px; width:760px; height:760px;
    background:radial-gradient(circle, rgba(102,192,244,.10) 0%, rgba(102,192,244,0) 62%);
  }
  .frame { position:absolute; inset:0; border:1px solid var(--line); }

  main {
    position:relative; height:100%; padding:0 56px 0 58px;
    display:flex; align-items:center; justify-content:space-between; gap:40px;
  }

  h1 { font-size:72px; line-height:1; color:var(--acc); font-weight:700; letter-spacing:-.025em; }
  h1 .js { color:var(--fg); opacity:.5; font-weight:600; }

  .tag { margin-top:14px; font-size:22px; line-height:1.45; color:var(--fg); font-weight:400; }
  .tag b { color:var(--acc); font-weight:700; }

  .cmd {
    border:1px solid var(--line); border-radius:8px;
    background:rgba(255,255,255,.02);
    padding:14px 24px; font-size:21px; color:var(--fg); white-space:nowrap;
    font-family:"Cascadia Code","Consolas",monospace;
  }
  .cmd .p { color:var(--acc); margin-right:12px; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="frame"></div>
  <main>
    <div>
      <h1>steamwand<span class="js">.js</span></h1>
      <div class="tag">
        Steamworks SDK bindings for TypeScript.<br>
        <b>No native build step.</b>
      </div>
    </div>
    <div class="cmd"><span class="p">$</span>npm i steamwand.js</div>
  </main>
</body>
</html>
